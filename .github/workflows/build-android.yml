name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.2.1)'
        required: true
        default: '1.2.1'
      client:
        description: 'Client id to build for (default = the public build). No branch needed — main is stamped at build time.'
        required: false
        default: 'default'

jobs:
  # Works out WHICH clients this run builds, before any building happens.
  #
  #   tag v2.0.6-seatos   -> just seatos
  #   tag v2.0.6          -> EVERY client in clients.json
  #   dispatch + client    -> just that client
  #   dispatch, no client  -> every client in clients.json
  #
  # The "every client" path is the point: teachers install the app on their
  # phones, so each school needs its own APK, and one unsuffixed tag now
  # produces all of them in parallel instead of one release run per school.
  plan:
    name: Plan builds
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      clients: ${{ steps.plan.outputs.clients }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version and client list
        id: plan
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW="${{ github.event.inputs.version }}"
            ONE="${{ github.event.inputs.client }}"
          else
            RAW="${GITHUB_REF_NAME}"
            ONE="$(echo "$RAW" | sed -E 's/^v[0-9]+\.[0-9]+\.[0-9]+//; s/^-//')"
          fi

          VERSION="$(echo "$RAW" | sed -E 's/^v//; s/-.*$//')"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Could not parse a semver version from '$RAW'" >&2
            exit 1
          fi

          if [[ -n "$ONE" && "$ONE" != "all" ]]; then
            CLIENTS="$(node -e 'console.log(JSON.stringify([process.argv[1]]))' "$ONE")"
            echo "Building a single client: $ONE"
          else
            CLIENTS="$(node -e '
              const { clients } = require("./clients.json");
              const ids = clients.map(c => c.id).filter(Boolean);
              if (!ids.length) { console.error("clients.json has no clients"); process.exit(1); }
              console.log(JSON.stringify(ids));
            ')"
            echo "Building every client in clients.json: $CLIENTS"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "clients=$CLIENTS" >> "$GITHUB_OUTPUT"

  build-android:
    name: APK (${{ matrix.client }})
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      # One school's build failing must not cancel the others — a broken
      # client is better than every school stuck on the old version.
      fail-fast: false
      matrix:
        client: ${{ fromJson(needs.plan.outputs.clients) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Resolve names for this client
        id: version
        run: |
          VERSION="${{ needs.plan.outputs.version }}"
          CLIENT="${{ matrix.client }}"
          # The public build keeps the bare tag so /releases/latest points at it
          # and an unbranded download never picks up a school's APK.
          if [[ "$CLIENT" == "default" ]]; then
            TAG="v$VERSION"
          else
            TAG="v$VERSION-$CLIENT"
          fi
          echo "client=$CLIENT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building for client '$CLIENT' as $TAG"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          # monotonic versionCode so Android accepts each release as an upgrade
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building Android version $VERSION (versionCode $VERSION_CODE)"

      # Stamps this throwaway checkout with the client's identity: the
      # <meta name="client-id"> a packaged app reads (it has no hostname to
      # detect itself from) and, for client builds, removes the public landing
      # page. Replaces what the per-client branches used to hold.
      - name: Stamp checkout for client
        run: node scripts/prepare-client-build.js "${{ steps.version.outputs.client }}" "${{ steps.version.outputs.version }}"

      - name: Set Android versionName/versionCode
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ steps.version.outputs.version_code }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.version }}\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/gen7cbt-release.keystore
            cat > android/keystore.properties <<EOF
          storeFile=gen7cbt-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=${ANDROID_KEY_ALIAS:-gen7cbt}
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
            echo "Release keystore configured."
          else
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set — building DEBUG apk. Debug builds are signed with a throwaway key, so installed apps CANNOT be updated in place. Add the keystore secrets to fix this."
          fi

      - name: Build Release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Build Debug APK (fallback — no keystore secrets)
        if: env.HAS_KEYSTORE == 'false'
        working-directory: android
        run: ./gradlew assembleDebug


      - name: Collect APK
        run: |
          mkdir -p apk-out
          # Client id in the filename so a school can tell at a glance which
          # APK is theirs, and so the matrix legs never collide on a release.
          SUFFIX=""
          if [[ "${{ steps.version.outputs.client }}" != "default" ]]; then
            SUFFIX="-${{ steps.version.outputs.client }}"
          fi
          if [[ "$HAS_KEYSTORE" == "true" ]]; then
            cp android/app/build/outputs/apk/release/app-release.apk \
               "apk-out/Gen7-CBT-Exam-${{ steps.version.outputs.version }}${SUFFIX}.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk \
               "apk-out/Gen7-CBT-Exam-${{ steps.version.outputs.version }}${SUFFIX}-debug.apk"
          fi
          ls -l apk-out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-apk-${{ matrix.client }}
          path: apk-out/*.apk
          if-no-files-found: error

      # Published from inside the matrix leg, not a separate job: each client
      # gets its OWN release at its own tag, so their installed app keeps
      # updating from v*-<client> and never sees another school's APK.
      # The tag is created here when it doesn't already exist.
      - name: Publish release for this client
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: apk-out/*.apk
          draft: false
          prerelease: false
