name: Build and Release Electron App

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0, v1.1.0, etc.
  workflow_dispatch: # Allow manual trigger
    inputs:
      version:
        description: 'Version number (e.g., 1.0.1)'
        required: true
        default: '1.0.0'
      client:
        description: 'Client id to build for (default = the public build). No branch needed — main is stamped at build time.'
        required: false
        default: 'default'

jobs:
  # Mirrors the Android workflow: an unsuffixed tag (v2.0.6) builds EVERY
  # client in clients.json, a suffixed one (v2.0.6-seatos) builds just that
  # school. See the comment in build-android.yml.
  plan:
    name: Plan builds
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      clients: ${{ steps.plan.outputs.clients }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version and client list
        id: plan
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW="${{ github.event.inputs.version }}"
            ONE="${{ github.event.inputs.client }}"
          else
            RAW="${GITHUB_REF_NAME}"
            ONE="$(echo "$RAW" | sed -E 's/^v[0-9]+\.[0-9]+\.[0-9]+//; s/^-//')"
          fi

          VERSION="$(echo "$RAW" | sed -E 's/^v//; s/-.*$//')"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Could not parse a semver version from '$RAW'" >&2
            exit 1
          fi

          if [[ -n "$ONE" && "$ONE" != "all" ]]; then
            CLIENTS="$(node -e 'console.log(JSON.stringify([process.argv[1]]))' "$ONE")"
          else
            CLIENTS="$(node -e '
              const { clients } = require("./clients.json");
              const ids = clients.map(c => c.id).filter(Boolean);
              if (!ids.length) { console.error("clients.json has no clients"); process.exit(1); }
              console.log(JSON.stringify(ids));
            ')"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "clients=$CLIENTS" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION for: $CLIENTS"

  build:
    name: Build (${{ matrix.os }} / ${{ matrix.client }})
    needs: plan
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        client: ${{ fromJson(needs.plan.outputs.clients) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve names for this client
        id: version
        shell: bash
        run: |
          VERSION="${{ needs.plan.outputs.version }}"
          CLIENT="${{ matrix.client }}"
          if [[ "$CLIENT" == "default" ]]; then TAG="v$VERSION"; else TAG="v$VERSION-$CLIENT"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "client=$CLIENT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building for client '$CLIENT' as $TAG"

      # Stamps the checkout with the client's meta tag and strips the landing
      # page for client builds. Replaces the per-client branches.
      - name: Stamp checkout for client
        shell: bash
        run: node scripts/prepare-client-build.js "${{ steps.version.outputs.client }}" "${{ steps.version.outputs.version }}"

      - name: Build Electron App (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: Build Electron App (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true  # Don't fail the whole job if upload has a transient 403
        with:
          # Client in the name so the release job can gather one school's
          # Windows + macOS installers without picking up another's.
          name: installers-${{ matrix.client }}-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest.yml
            dist/latest-mac.yml
          if-no-files-found: ignore

  # One release per client, each gathering that client's Windows + macOS
  # installers. Runs once per client rather than once overall, so a school's
  # installed app keeps auto-updating from its own tag.
  release:
    name: Release (${{ matrix.client }})
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        client: ${{ fromJson(needs.plan.outputs.clients) }}

    steps:
      - name: Resolve tag for this client
        id: tag
        run: |
          VERSION="${{ needs.plan.outputs.version }}"
          CLIENT="${{ matrix.client }}"
          if [[ "$CLIENT" == "default" ]]; then TAG="v$VERSION"; else TAG="v$VERSION-$CLIENT"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download this client's installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-${{ matrix.client }}-*
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: ls -R artifacts || echo "(no artifacts for this client)"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.blockmap
            artifacts/latest.yml
            artifacts/latest-mac.yml
          draft: false
          prerelease: false
