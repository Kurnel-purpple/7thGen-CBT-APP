<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="client-id" content="seatos">
    <title>Results - CBT Exam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
        (function() {
            var t = localStorage.getItem('theme');
            if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../modules/cbt/css/results.css">
    <!-- Font Awesome for high-quality icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="app-container no-sidebar">
        <!-- Topbar -->
        <header class="main-header results-topbar">
            <div class="topbar-left">
                <button onclick="window.history.back()" class="btn-back" aria-label="Go back">
                    <i class="fas fa-arrow-left"></i>
                    <span>Back</span>
                </button>
                <button onclick="window.history.back()" class="btn-back-mobile" aria-label="Go back">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <h1 class="topbar-title">Exam Results</h1>
            </div>
            <div class="topbar-right user-menu">
                <!-- Dark mode toggle injected by utils.js -->
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content results-content" style="display: block;">

            <div id="loading" class="loader"></div>

            <div id="result-content" style="display: none;">
                <!-- Score Hero Card -->
                <div class="result-header">
                    <h2 id="exam-title">Exam Title</h2>
                    <p id="student-name" class="student-name">Student Name</p>

                    <div class="score-circle" id="score-circle">
                        0%
                    </div>
                    <div>
                        <span id="pass-status" class="pass-status">PASSED</span>
                        <p id="points-summary" class="points-summary">0 / 0 Points</p>
                    </div>
                </div>

                <!-- Question Breakdown -->
                <h3 class="results-section-title">Question Breakdown</h3>
                <div id="questions-list">
                    <!-- Dynamic -->
                </div>

                <!-- Theory Grading Save Button (only visible for teachers) -->
                <div id="theory-grading-actions" class="theory-grading-actions" style="display:none;">
                    <button onclick="resultsController.saveTheoryScores()" class="btn btn-primary">
                        <i class="fas fa-save" style="margin-right: 6px;"></i> Save Theory Grades
                    </button>
                    <p>
                        This will update the student's total score including theory question points
                    </p>
                </div>
            </div>

        </main>
    </div>

    <!-- PocketBase SDK -->
    <script src="https://unpkg.com/pocketbase@0.21.0/dist/pocketbase.umd.js"></script>
    <!-- Configuration System -->
    <script type="module">
        import { bootstrapModulePage } from '../core/modules/pageBootstrap.js';

        await bootstrapModulePage({
            moduleId: 'cbt',
            moduleName: 'CBT',
            title: 'CBT module is not enabled',
            message: 'The exam/assessment feature is not available for this school configuration.',
            globalScripts: [
                '../js/utils.js',
                '../js/dataService.js',
                '../js/auth.js'
            ],
            moduleScripts: [
                '../modules/cbt/js/cbtDataService.js',
                '../modules/cbt/js/activityWatcher.js',
                '../modules/cbt/js/results.js'
            ]
        });
    </script>
</body>

</html>
