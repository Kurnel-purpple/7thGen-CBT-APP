<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="client-id" content="default">
    <title>Exam Results - CBT Exam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
        (function() {
            var t = localStorage.getItem('theme');
            if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../modules/cbt/css/results.css">
    <!-- Font Awesome for high-quality icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="app-container no-sidebar">
        <!-- Topbar -->
        <header class="main-header results-topbar exam-results-topbar">
            <div class="topbar-left">
                <button onclick="window.location.href='teacher-dashboard.html'" class="btn-back" aria-label="Back to Dashboard">
                    <i class="fas fa-arrow-left"></i>
                    <span>Dashboard</span>
                </button>
                <button onclick="window.location.href='teacher-dashboard.html'" class="btn-back-mobile" aria-label="Back to Dashboard">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div class="topbar-title-group">
                    <h1 class="topbar-title" id="exam-title">Exam Results</h1>
                    <span class="topbar-subtitle" id="exam-subtitle"></span>
                </div>
            </div>
            <div class="topbar-center">
                <!-- Inline stats -->
                <div class="topbar-stats">
                    <div class="topbar-stat">
                        <i class="fas fa-chart-line"></i>
                        <span class="topbar-stat-value" id="stats-avg">0%</span>
                        <span class="topbar-stat-label">Avg</span>
                    </div>
                    <div class="topbar-stat">
                        <i class="fas fa-check-circle"></i>
                        <span class="topbar-stat-value" id="stats-pass-rate">0%</span>
                        <span class="topbar-stat-label">Pass</span>
                    </div>
                    <div class="topbar-stat">
                        <i class="fas fa-users"></i>
                        <span class="topbar-stat-value" id="stats-total">0</span>
                        <span class="topbar-stat-label">Total</span>
                    </div>
                </div>
            </div>

            <div class="topbar-right user-menu">
                <!-- Action buttons -->
                <div class="topbar-actions">
                    <button id="save-all-theory-btn" class="topbar-action-btn save-theory-btn"
                        style="display:none;"
                        onclick="examResults.saveAllManualTheoryScores()">
                        <i class="fas fa-save"></i>
                        <span>Save All Scores</span>
                    </button>
                    <button class="topbar-action-btn" onclick="examResults.exportCSV()">
                        <i class="fas fa-download"></i>
                        <span>Export</span>
                    </button>
                </div>
                <!-- Dark mode toggle injected by utils.js -->
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content results-content results-content--wide" style="display: block;">

            <!-- Desktop: Result Boxes -->
            <div class="results-table-container">
                <div id="results-body" class="result-boxes-container">
                    <!-- Dynamic -->
                    <div class="result-boxes-loading">
                        <div class="loader" style="margin: 0 auto;"></div>
                    </div>
                </div>
            </div>

            <!-- Mobile: Card View -->
            <div class="results-cards-container" id="results-cards">
                <!-- Dynamic cards will be inserted here -->
                <div style="text-align: center; padding: 40px;">
                    <div class="loader" style="margin: 0 auto;"></div>
                </div>
            </div>

        </main>
    </div>

    <!-- PocketBase SDK -->
    <script src="https://unpkg.com/pocketbase@0.21.0/dist/pocketbase.umd.js"></script>
    <!-- Configuration System -->
    <script type="module">
        import { bootstrapModulePage } from '../core/modules/pageBootstrap.js';

        await bootstrapModulePage({
            moduleId: 'cbt',
            moduleName: 'CBT',
            title: 'CBT module is not enabled',
            message: 'The exam/assessment feature is not available for this school configuration.',
            globalScripts: [
                '../modules/cbt/js/idb.js',
                '../js/utils.js',
                '../js/dataService.js',
                '../js/auth.js'
            ],
            moduleScripts: [
                '../modules/cbt/js/cbtDataService.js',
                '../modules/cbt/js/examResults.js'
            ]
        });
    </script>
</body>

</html>
