<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="client-id" content="default">
    <title>Report Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
        (function() {
            var t = localStorage.getItem('theme');
            if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../modules/report_cards/css/report-card-document.css">
    <style>
        /* main.css locks the app shell to the viewport — `body { height: 100vh;
           overflow: hidden }` — because every dashboard scrolls inside its own panel.
           This page has no such panel: the sheet is simply taller than the screen, so
           the lock has to be lifted here or everything below the fold is unreachable.
           This was the "full page report card doesn't scroll" bug. */
        html, body {
            height: auto;
            min-height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* The page around the sheet. The sheet itself is always paper-white;
           only this backdrop follows the app theme. */
        .rcd-page {
            min-height: 100vh;
            background: var(--background-color, #f0f2f5);
            padding: 0 0 96px;
        }

        .rcd-bar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .rcd-bar-title {
            margin: 0;
            font-family: var(--font-heading);
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
            flex: 1;
        }

        .rcd-icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: var(--text-color);
            cursor: pointer;
        }
        .rcd-icon-btn:hover { background: var(--inner-bg, rgba(0, 0, 0, 0.05)); }

        .rcd-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .rcd-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 40px;
            padding: 9px 18px;
            border: none;
            border-radius: 50px;
            background: var(--primary-color);
            color: #fff;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
        }
        .rcd-btn:hover { opacity: 0.9; }
        .rcd-btn:active { transform: scale(0.97); }

        /* Drop-shadowed sheet so it reads as a document on the page */
        .rcd-stage { padding: 24px 16px; }
        .rcd-stage .rcd-sheet {
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
            border-radius: 4px;
        }
        [data-theme="dark"] .rcd-stage .rcd-sheet {
            box-shadow: 0 4px 28px rgba(0, 0, 0, 0.5);
        }

        .rcd-state {
            padding: 64px 24px;
            text-align: center;
            color: var(--light-text);
        }
        .rcd-state h2 {
            margin: 12px 0 6px;
            font-family: var(--font-heading);
            font-size: 1.05rem;
            color: var(--text-color);
        }

        /* Mobile: actions move to a fixed bar so the sheet gets the screen */
        @media (max-width: 768px) {
            .rcd-stage { padding: 12px 8px; }
            .rcd-bar .rcd-actions { display: none; }
            .rcd-mobile-actions {
                display: flex;
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 90;
                gap: 8px;
                padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
                background: var(--card-bg);
                border-top: 1px solid var(--border-color);
            }
            .rcd-mobile-actions .rcd-btn { flex: 1; justify-content: center; }
        }
        .rcd-mobile-actions { display: none; }
    </style>
</head>

<body>
    <div class="rcd-page">
        <header class="rcd-bar rcd-no-print">
            <button class="rcd-icon-btn" id="rcd-back" aria-label="Go back" title="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="22" height="22"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            </button>
            <h1 class="rcd-bar-title" id="rcd-title">Report Card</h1>
            <div class="rcd-actions">
                <button class="rcd-btn" id="rcd-download">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Download PDF
                </button>
            </div>
        </header>

        <main class="rcd-stage rcd-host" id="rcd-stage">
            <div class="rcd-state rcd-no-print" id="rcd-loading">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="40" height="40"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <h2>Loading report card&hellip;</h2>
            </div>
        </main>

        <nav class="rcd-mobile-actions rcd-no-print">
            <button class="rcd-btn" id="rcd-download-mobile">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Download PDF
            </button>
        </nav>
    </div>

    <!-- Real PDF generation for the Download button. Loaded from a CDN, so downloadPdf()
         falls back to the print dialog when it is unavailable (offline, filtered network). -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://unpkg.com/pocketbase@0.21.0/dist/pocketbase.umd.js" crossorigin="anonymous"></script>
    <script type="module">
        import { bootstrapModulePage } from '../core/modules/pageBootstrap.js';

        function stage(html) {
            document.getElementById('rcd-stage').innerHTML = html;
        }

        function stateBlock(title, message) {
            return '<div class="rcd-state rcd-no-print">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="40" height="40">' +
                '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
                '<h2>' + title + '</h2><p>' + message + '</p></div>';
        }

        function goBack() {
            if (window.history.length > 1) window.history.back();
            else window.location.href = 'admin-dashboard.html';
        }

        /**
         * Download the report card as an actual PDF file.
         *
         * This button used to call window.print(), which opens the print dialog and
         * leaves it to the user to find "Save as PDF" — not what a button labelled
         * "Download PDF" promises.
         *
         * html2pdf is loaded from a CDN, so it can be missing on a machine that is
         * offline or behind a filter. Rather than fail, that case falls back to the
         * print dialog and says so, because print-to-PDF still gets the user a file.
         */
        async function downloadPdf(btn) {
            var sheet = document.querySelector('#rcd-stage .rcd-sheet') ||
                        document.getElementById('rcd-stage');
            if (!sheet) return;

            if (typeof window.html2pdf === 'undefined') {
                await Utils.showAlert(
                    'PDF Tool Unavailable',
                    'The PDF generator could not be loaded — you may be offline.<br><br>' +
                    'Opening the print dialog instead: choose <strong>Save as PDF</strong> as the destination.'
                );
                window.print();
                return;
            }

            var original = btn ? btn.innerHTML : '';
            if (btn) { btn.disabled = true; btn.textContent = 'Preparing…'; }

            var name = (document.title || 'Report Card').replace(/[^a-zA-Z0-9]+/g, '_');
            try {
                await window.html2pdf()
                    .set({
                        margin: 0,
                        filename: name + '.pdf',
                        // Rendered at 2x so text stays sharp in print rather than
                        // reading as a screenshot of a screen.
                        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
                        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                        pagebreak: { mode: ['css', 'legacy'] }
                    })
                    .from(sheet)
                    .save();
            } catch (err) {
                console.error('[ReportCard] PDF generation failed:', err);
                await Utils.showAlert(
                    'Could Not Create PDF',
                    'Something went wrong generating the file. Opening the print dialog instead — ' +
                    'choose <strong>Save as PDF</strong> as the destination.'
                );
                window.print();
            } finally {
                if (btn) { btn.disabled = false; btn.innerHTML = original; }
            }
        }

        document.getElementById('rcd-back').addEventListener('click', goBack);
        document.getElementById('rcd-download').addEventListener('click', function () { downloadPdf(this); });
        document.getElementById('rcd-download-mobile').addEventListener('click', function () { downloadPdf(this); });

        try {
            const ok = await bootstrapModulePage({
                moduleId: 'report_cards',
                moduleName: 'Report Cards',
                title: 'Report Cards module is not enabled',
                message: 'The report cards feature is not available for this school configuration.',
                currentModuleId: 'report_cards',
                renderNav: false,
                globalScripts: [
                    '../core/shared/academicEntities.js',
                    '../js/utils.js',
                    '../js/dataService.js',
                    '../js/auth.js'
                ],
                moduleScripts: [
                    '../modules/report_cards/js/reportCardDataService.js',
                    '../modules/report_cards/js/reportCardTemplate.js',
                    '../modules/report_cards/js/reportCardDocument.js'
                ]
            });

            if (!ok) throw new Error('module disabled');

            const cardId = new URLSearchParams(window.location.search).get('id');
            if (!cardId) {
                stage(stateBlock('No report card selected', 'This page needs a report card to show. Open it from the results list.'));
                throw new Error('missing id');
            }

            // Template first so the letterhead is right on the first paint;
            // it fails soft to defaults if app_settings is unreachable.
            const [card, template] = await Promise.all([
                dataService.getReportCardById(cardId),
                dataService.loadReportCardTemplate()
            ]);

            if (!card) {
                stage(stateBlock('Report card not found', 'It may have been deleted, or you may not have access to it.'));
                throw new Error('not found');
            }

            document.title = (card.studentName || 'Report Card') + ' — ' +
                [card.classLevel, card.term].filter(Boolean).join(' ');
            document.getElementById('rcd-title').textContent = card.studentName || 'Report Card';

            stage(window.reportCardDocument.render(card, template));

            // Print straight away when asked (?print=1), e.g. from a list's
            // download action, so it is one tap rather than two.
            if (new URLSearchParams(window.location.search).get('print') === '1') {
                setTimeout(() => window.print(), 350);
            }
        } catch (err) {
            console.error('[ReportCardPrint]', err);
        }
    </script>
</body>

</html>
