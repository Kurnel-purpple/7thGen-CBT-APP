<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><title>Congrats preview</title></head><body style="margin:0;font-family:sans-serif;background:#222;color:#fff">
<div style="position:fixed;top:10px;left:10px;z-index:200000;display:flex;gap:8px;flex-wrap:wrap;background:#000a;padding:8px;border-radius:8px">
<button onclick="renderCongratulations({className:'JSS1'})">JSS1 gold</button>
<button onclick="renderCongratulations({className:'JSS2'})">JSS2 silver</button>
<button onclick="renderCongratulations({className:'JSS3'})">JSS3 gold</button>
<button onclick="renderCongratulations({className:'SS1'})">SS1 silver</button>
<button onclick="renderCongratulations({className:'SS2'})">SS2 gold</button>
<button onclick="renderCongratulations({className:'SS3'})">SS3 silver</button>
<button onclick="renderCongratulations({className:'Graduated'})">Graduation</button>
</div>
<p style="padding:60px 20px">Click a button to preview each variant.</p>
<script>// ── Reusable full-screen "Congratulations" component ──────────────
        // One renderer for every class. Pass { className } — it themes itself
        // gold/silver by ladder position, and switches to a graduation layout
        // when className is "Graduated". Dismissing slides it away and (if a
        // dismissKey is given) remembers it so it only shows once per session.
        function renderCongratulations({ className, dismissKey } = {}) {
            const LADDER = ['Grade 4', 'Grade 5&6', 'JSS1', 'JSS2', 'JSS3', 'SS1', 'SS2', 'SS3'];
            const norm = (v) => String(v || '').replace(/\s+/g, '').toUpperCase();
            const graduated = norm(className) === 'GRADUATED';
            const idx = LADDER.findIndex((c) => norm(c) === norm(className));
            // Alternate gold / silver down the ladder (odd rung = silver), like the reference.
            const metal = graduated ? 'grad' : (idx >= 0 && idx % 2 === 1 ? 'silver' : 'gold');
            const displayClass = String(className || '').toUpperCase().replace(/[<>]/g, '');

            injectCongratsAssets();

            const crown = '<svg viewBox="0 0 24 24" width="46" height="46" fill="currentColor" aria-hidden="true"><path d="M5 16 3 6l5.2 4L12 3l3.8 7L21 6l-2 10z"/><rect x="5" y="17.4" width="14" height="2.1" rx="1"/></svg>';
            const cap = '<svg viewBox="0 0 24 24" width="66" height="66" fill="currentColor" aria-hidden="true"><path d="M12 3 1 9l11 6 9-4.91V17h2V9zM5 13.18V17c0 1.66 3.13 3 7 3s7-1.34 7-3v-3.82l-7 3.82z"/></svg>';
            const laurel = '<svg viewBox="0 0 200 60" width="176" height="54" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">'
                + '<path fill="currentColor" stroke="none" d="M100 18l4.1 8.3 9.2 1.3-6.7 6.5 1.6 9.1L100 39l-8.2 4.3 1.6-9.1-6.7-6.5 9.2-1.3z"/>'
                + '<path d="M88 36C72 38 58 34 48 24" stroke-linecap="round"/><path d="M62 32q-6-6-4-13" stroke-linecap="round"/><path d="M70 34q-6-5-5-12" stroke-linecap="round"/><path d="M78 35q-5-5-5-11" stroke-linecap="round"/>'
                + '<path d="M112 36c16 2 30-2 40-12" stroke-linecap="round"/><path d="M138 32q6-6 4-13" stroke-linecap="round"/><path d="M130 34q6-5 5-12" stroke-linecap="round"/><path d="M122 35q5-5 5-11" stroke-linecap="round"/>'
                + '</svg>';

            const overlay = document.createElement('div');
            overlay.id = 'promo-congrats';
            overlay.className = 'promo-congrats theme-' + metal;

            const inner = graduated
                ? (
                    '<div class="pc-cap pc-ico-gold">' + cap + '</div>'
                    + '<div class="pc-eyebrow">The End Of An Era</div>'
                    + '<div class="pc-grad-title pc-gold">CONGRATULATIONS</div>'
                    + '<div class="pc-grad-on">ON YOUR</div>'
                    + '<div class="pc-grad-word pc-silver">GRADUATION</div>'
                    + '<div class="pc-grad-wish pc-gold">Wishing you astronomical<br>success as you advance</div>'
                    + '<div class="pc-laurel pc-ico-metal">' + laurel + '</div>'
                )
                : (
                    '<div class="pc-crown pc-ico-gold">' + crown + '</div>'
                    + '<div class="pc-eyebrow">You’ve Been Promoted</div>'
                    + '<div class="pc-script pc-metal">Congratulations</div>'
                    + '<div class="pc-divider">To You</div>'
                    + '<div class="pc-welcome pc-metal">Welcome To</div>'
                    + '<div class="pc-class pc-metal">' + displayClass + '</div>'
                    + '<div class="pc-laurel pc-ico-metal">' + laurel + '</div>'
                );

            overlay.innerHTML =
                '<div class="pc-glow"></div>'
                + '<div class="pc-frame"></div>'
                + '<div class="pc-confetti-layer" aria-hidden="true"></div>'
                + '<div class="pc-inner">' + inner
                + '<button class="pc-continue" type="button">Continue</button>'
                + '</div>';

            document.body.appendChild(overlay);
            document.body.style.overflow = 'hidden';
            spawnConfetti(overlay.querySelector('.pc-confetti-layer'));

            const close = () => {
                overlay.classList.add('closing');
                document.body.style.overflow = '';
                if (dismissKey) { try { localStorage.setItem(dismissKey, '1'); } catch (e) { /* ignore */ } }
                setTimeout(() => overlay.remove(), 480);
            };
            overlay.querySelector('.pc-continue').addEventListener('click', close);
            document.addEventListener('keydown', function esc(e) {
                if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); }
            });
        }

        // Console preview: run e.g. previewCongrats('JSS2') or previewCongrats('Graduated')
        window.previewCongrats = (cls) => renderCongratulations({ className: cls || 'JSS1' });

        function spawnConfetti(layer) {
            if (!layer) return;
            const gold = ['#f7d774', '#e9c45a', '#c8971a', '#fff0b0'];
            const silver = ['#e8ebef', '#c4c9d0', '#ffffff', '#9aa1ab'];
            const pool = gold.concat(silver);
            for (let i = 0; i < 34; i++) {
                const s = document.createElement('span');
                const w = 5 + Math.random() * 6;
                s.className = 'pc-confetti';
                s.style.left = (Math.random() * 100) + '%';
                s.style.width = w + 'px';
                s.style.height = (w * (1.4 + Math.random())) + 'px';
                s.style.background = pool[(Math.random() * pool.length) | 0];
                s.style.animationDuration = (3.2 + Math.random() * 3.5) + 's';
                s.style.animationDelay = (-Math.random() * 5) + 's';
                s.style.opacity = (0.6 + Math.random() * 0.4).toFixed(2);
                s.style.setProperty('--pc-rot', (360 + Math.random() * 540) + 'deg');
                layer.appendChild(s);
            }
        }

        function injectCongratsAssets() {
            if (!document.getElementById('pc-font-link')) {
                const link = document.createElement('link');
                link.id = 'pc-font-link';
                link.rel = 'stylesheet';
                link.href = 'https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap';
                document.head.appendChild(link);
            }
            if (document.getElementById('pc-styles')) return;
            const st = document.createElement('style');
            st.id = 'pc-styles';
            st.textContent = `
            .promo-congrats {
                position: fixed; inset: 0; z-index: 100000;
                width: 100vw; height: 100vh; min-height: 100dvh;
                display: flex; align-items: center; justify-content: center;
                padding: 24px; box-sizing: border-box; overflow: hidden;
                background: radial-gradient(ellipse at 50% 24%, #1c1c1f 0%, #0c0c0e 58%, #050506 100%);
                font-family: 'Nunito', 'Figtree', sans-serif;
                animation: pc-fade-in .5s ease both;
            }
            .promo-congrats.closing { animation: pc-fade-out .45s ease forwards; }
            @keyframes pc-fade-in { from { opacity: 0; } to { opacity: 1; } }
            @keyframes pc-fade-out { to { opacity: 0; transform: scale(1.02); } }
            .promo-congrats .pc-glow {
                position: absolute; inset: 0; pointer-events: none;
                background: radial-gradient(circle at 50% 34%, rgba(233,196,90,0.16), transparent 42%);
                animation: pc-glow-pulse 4.5s ease-in-out infinite;
            }
            .promo-congrats .pc-frame {
                position: absolute; inset: 16px; z-index: 2; pointer-events: none;
                border: 1px solid rgba(233,196,90,.22); border-radius: 16px;
                box-shadow: inset 0 0 70px rgba(0,0,0,.55);
            }
            .promo-congrats.theme-silver .pc-frame { border-color: rgba(210,216,224,.22); }
            .promo-congrats.theme-silver .pc-glow { background: radial-gradient(circle at 50% 34%, rgba(200,206,214,0.14), transparent 42%); }
            .promo-congrats .pc-inner {
                position: relative; z-index: 3; text-align: center;
                width: 100%; max-width: min(1140px, 94vw);
                animation: pc-rise .8s cubic-bezier(.22,1,.36,1) both;
            }
            @keyframes pc-rise { from { transform: translateY(26px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

            .promo-congrats .pc-crown, .promo-congrats .pc-cap { line-height: 0; margin-bottom: 12px; animation: pc-float 3.2s ease-in-out infinite; }
            .promo-congrats .pc-eyebrow {
                color: #d6b048; letter-spacing: .38em; font-size: clamp(.62rem,2.6vw,.78rem);
                font-weight: 800; text-transform: uppercase; margin: 0 0 4px; padding-left: .38em;
            }
            .promo-congrats .pc-script {
                font-family: 'Great Vibes','Brush Script MT','Segoe Script',cursive;
                font-size: clamp(2.8rem,13vw,5.5rem); line-height: 1; margin: 2px 0 0; font-weight: 400;
                white-space: nowrap;
            }
            .promo-congrats .pc-divider {
                display: flex; align-items: center; justify-content: center; gap: 14px;
                color: #cbb26a; font-size: clamp(.72rem,3vw,.9rem); letter-spacing: .34em;
                text-transform: uppercase; font-weight: 700; margin: 8px 0 26px; padding-left: .34em;
            }
            .promo-congrats .pc-divider::before, .promo-congrats .pc-divider::after {
                content: ''; width: clamp(28px,9vw,52px); height: 1px;
                background: linear-gradient(90deg, transparent, #cbb26a);
            }
            .promo-congrats .pc-divider::after { background: linear-gradient(90deg, #cbb26a, transparent); }
            .promo-congrats .pc-welcome {
                letter-spacing: .28em; font-size: clamp(.95rem,3.6vw,1.25rem);
                font-weight: 800; text-transform: uppercase; margin-bottom: 10px; padding-left: .28em;
                white-space: nowrap;
            }
            .promo-congrats .pc-class {
                font-family: 'DM Sans','Plus Jakarta Sans',sans-serif; font-weight: 900;
                font-size: clamp(3rem,15vw,7rem); line-height: .92; letter-spacing: .01em;
                text-transform: uppercase; white-space: nowrap;
            }
            .promo-congrats .pc-laurel { margin-top: 28px; line-height: 0; }

            /* Graduation variant */
            .promo-congrats .pc-grad-title { font-family: 'DM Sans','Plus Jakarta Sans',sans-serif; font-weight: 900; letter-spacing: .03em; font-size: clamp(1.5rem,8vw,3.2rem); line-height: 1; margin-top: 4px; white-space: nowrap; }
            .promo-congrats .pc-grad-on { color: #e7ebf0; letter-spacing: .4em; font-weight: 700; font-size: clamp(.8rem,3vw,1rem); margin: 12px 0 2px; padding-left: .4em; white-space: nowrap; }
            .promo-congrats .pc-grad-word { font-family: 'DM Sans','Plus Jakarta Sans',sans-serif; font-weight: 900; letter-spacing: .02em; font-size: clamp(2.2rem,12vw,5rem); line-height: .95; white-space: nowrap; }
            .promo-congrats .pc-grad-wish { margin-top: 20px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; font-size: clamp(.72rem,2.8vw,.9rem); line-height: 1.7; }

            /* Metallic text fills with a slow shine sweep across the letters */
            .promo-congrats .pc-gold, .promo-congrats.theme-gold .pc-metal {
                --pc-fill: linear-gradient(180deg,#fff4c2 0%,#f3cf72 34%,#c8951a 55%,#f6dd8a 78%,#b8860b 100%);
                --pc-shadow: rgba(212,175,55,.34);
            }
            .promo-congrats .pc-silver, .promo-congrats.theme-silver .pc-metal {
                --pc-fill: linear-gradient(180deg,#ffffff 0%,#dfe3e8 34%,#9aa1ab 55%,#f2f4f7 78%,#aeb4bd 100%);
                --pc-shadow: rgba(185,195,205,.3);
            }
            .promo-congrats .pc-gold, .promo-congrats .pc-silver,
            .promo-congrats.theme-gold .pc-metal, .promo-congrats.theme-silver .pc-metal {
                background-image: linear-gradient(100deg, transparent 42%, rgba(255,255,255,.9) 50%, transparent 58%), var(--pc-fill);
                background-size: 250% 100%, 100% 100%;
                background-position: 250% 0, 0 0;
                background-repeat: no-repeat;
                -webkit-background-clip: text; background-clip: text;
                -webkit-text-fill-color: transparent; color: transparent;
                filter: drop-shadow(0 3px 14px var(--pc-shadow));
                animation: pc-shine 3.8s ease-in-out .4s infinite;
            }
            /* Graduation laurel fill: solid gold (no clip needed) */
            .promo-congrats.theme-grad .pc-metal { color: #ecc65c; -webkit-text-fill-color: currentColor; background: none; filter: none; animation: none; }

            /* Solid-colour icon tints — SVGs use currentColor, kept off the text-clip path */
            .promo-congrats .pc-ico-gold, .promo-congrats.theme-gold .pc-ico-metal, .promo-congrats.theme-grad .pc-ico-metal { color: #ecc65c; filter: drop-shadow(0 2px 10px rgba(233,196,90,.4)); }
            .promo-congrats .pc-ico-silver, .promo-congrats.theme-silver .pc-ico-metal { color: #dfe4ea; filter: drop-shadow(0 2px 10px rgba(200,208,218,.35)); }

            @keyframes pc-shine { 0% { background-position: 250% 0, 0 0; } 55%, 100% { background-position: -150% 0, 0 0; } }
            @keyframes pc-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
            @keyframes pc-glow-pulse { 0%, 100% { opacity: .65; } 50% { opacity: 1; } }

            .promo-congrats .pc-continue {
                margin-top: 36px; background: transparent; border: 1.5px solid rgba(233,196,90,.55);
                color: #ecc65c; padding: 13px 40px; border-radius: 999px; font-family: inherit;
                font-weight: 800; font-size: .92rem; letter-spacing: .05em; cursor: pointer;
                transition: background .2s ease, border-color .2s ease, transform .1s ease;
            }
            .promo-congrats.theme-silver .pc-continue { border-color: rgba(210,216,224,.55); color: #e6eaef; }
            .promo-congrats .pc-continue:hover { background: rgba(233,196,90,.12); border-color: #ecc65c; }
            .promo-congrats.theme-silver .pc-continue:hover { background: rgba(210,216,224,.12); border-color: #e6eaef; }
            .promo-congrats .pc-continue:active { transform: scale(.97); }

            .promo-congrats .pc-confetti-layer { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
            .promo-congrats .pc-confetti {
                position: absolute; top: -24px; border-radius: 1px;
                animation-name: pc-fall; animation-timing-function: linear; animation-iteration-count: infinite;
            }
            @keyframes pc-fall {
                0% { transform: translateY(-24px) rotate(0); }
                100% { transform: translateY(105vh) rotate(var(--pc-rot,360deg)); }
            }
            @media (prefers-reduced-motion: reduce) {
                .promo-congrats, .promo-congrats .pc-inner, .promo-congrats .pc-glow,
                .promo-congrats .pc-crown, .promo-congrats .pc-cap,
                .promo-congrats .pc-gold, .promo-congrats .pc-silver,
                .promo-congrats .pc-metal { animation: none !important; }
                .promo-congrats .pc-confetti { display: none; }
            }
            `;
            document.head.appendChild(st);
        }</script></body></html>
